name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, static GTK check and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
          # Stubs only: PyGObject itself cannot be built from PyPI without the
          # GTK development headers, and no test needs a display.
          python -m pip install --no-deps PyGObject-stubs

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Static GTK API check
        run: python scripts/check_gtk_api.py --verbose

      - name: Tests
        run: python -m pytest -q

  package:
    name: Build and install the distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the packaged data
        run: |
          python -c "
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              'ubuntu_clipboard/ui/styles.css',
              'ubuntu_clipboard/assets/hicolor/512x512/apps/ubuntu-clipboard.png',
          ]
          missing = [name for name in required if name not in names]
          assert not missing, f'missing from {wheel}: {missing}'
          print('packaged data ok:', wheel)
          "

      - name: Install the wheel and run the console scripts
        run: |
          python -m venv /tmp/installed
          /tmp/installed/bin/pip install dist/*.whl
          /tmp/installed/bin/ubuntu-clipboard --version
          /tmp/installed/bin/ubuntu-clipboard --status
          /tmp/installed/bin/ubuntu-clipboard-daemon --version
