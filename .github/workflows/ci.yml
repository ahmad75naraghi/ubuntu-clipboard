name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, static GTK check and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
          # Stubs only: PyGObject itself cannot be built from PyPI without the
          # GTK development headers, and no test needs a display.
          python -m pip install --no-deps PyGObject-stubs

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Static GTK API check
        run: python scripts/check_gtk_api.py --verbose

      - name: Tests
        run: python -m pytest -q
